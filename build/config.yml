# Wails project configuration. The version below is set by `make version V=x.y.z`.
# Don't run `wails3 update build-assets` / `wails3 task common:update:build-assets`:
# it regenerates build/windows/* and overwrites the customized files.
version: '3'

info:
  companyName: "Jacopo Filonzi"
  productName: "wchron"
  productIdentifier: "com.jacopofilonzi.wchron"
  description: "Scheduled file sending to WhatsApp"
  copyright: "(c) 2026, Jacopo Filonzi"
  comments: ""
  version: "0.8.0"

# Dev mode configuration (`make dev`)
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
