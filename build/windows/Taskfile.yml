version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds bin/wchron.exe (DEV=true for the dev build)
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
      - cmd: powershell -NoProfile -Command Remove-Item *.syso
        platforms: [windows]
      # The release workflow cross-compiles on Linux.
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: '0'
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: Builds the per-user NSIS installer bin/wchron-<arch>-installer.exe
    cmds:
      - task: create:nsis:installer

  generate:syso:
    summary: Generates the Windows `.syso` file (icon, manifest, version info)
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  create:nsis:installer:
    summary: Creates the NSIS installer. Per-user only ($LOCALAPPDATA\Programs\wchron, no UAC).
    dir: build/windows/nsis
    deps:
      - task: build
    cmds:
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      - '"{{.MAKENSIS}}" -DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user -DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.EXE}}" project.nsi'
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      ARG_FLAG: '{{if eq .ARCH "amd64"}}AMD64{{else}}ARM64{{end}}'
      # Windows (make package) or Linux (the release workflow's cross-compile).
      EXE: '{{if eq OS "windows"}}{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe{{else}}{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe{{end}}'
      # The Makefile passes the full path: NSIS is usually not in the PATH.
      MAKENSIS: '{{.MAKENSIS | default "makensis"}}'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
